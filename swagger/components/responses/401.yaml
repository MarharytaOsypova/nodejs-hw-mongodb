description: Unauthorized
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - errors
      properties:
        status:
          type: integer
          example: 401
        message:
          type: string
          example: 'Session not found'
        errors:
          type: array
          items:
            type: string
          example: []
