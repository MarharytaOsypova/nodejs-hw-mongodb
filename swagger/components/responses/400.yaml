description: Bad Request
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - errors
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: 'Bad request'
        errors:
          type: array
          items:
            type: object
            required:
              - message
              - path
              - type
            properties:
              message:
                type: string
                example: '"phoneNumber" is required'
              path:
                type: array
                items:
                  type: string
                example: ['phoneNumber']
              type:
                type: string
                example: 'any.required'
