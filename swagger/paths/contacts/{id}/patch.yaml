tags:
  - Contacts
summary: Patch a contact
operationId: patchContact
description: 'Update contact fields. The request supports optional fields for updating and an optional photo upload.'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
    example: '60c72b2f9d1f8b001c8e4f42'
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: "Contact's name"
            example: 'John Doe'
          phoneNumber:
            type: string
            description: "Contact's phone number"
            example: '380200000022'
          email:
            type: string
            description: "Contact's email"
            example: 'john.doe@example.com'
          isFavourite:
            type: boolean
            description: "Contact's favourite status"
            example: false
          contactType:
            type: string
            description: "Contact's type"
            enum: ['work', 'home', 'personal']
            example: 'work'
          photo:
            type: string
            format: binary
            description: "Contact's photo file"
responses:
  '200':
    description: Successfully patched a contact!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '400':
    $ref: '../../../components/responses/400.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
